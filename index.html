<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>National Finance - Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Common CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page-wrapper">

        <!-- Main Container -->
        <div class="login-container">

            <!-- ================= LEFT SIDE ================= -->
            <div class="left-section">

                <div class="welcome-section">

                    <!-- Logo -->
                    <div class="logo-symbol">
                        <div class="logo-blue"></div>
                        <div class="logo-orange"></div>
                    </div>

                    <h1>Welcome to</h1>

                    <p class="company-name">
                        National Finance Ltd.
                    </p>

                    <p class="description">
                        Leveraging cutting-edge technology to offer innovative,
                        secure, and customer-focused financial solutions.
                    </p>

                    <!-- Slider Dots -->
                    <div class="slider-dots">
                        <span class="active"></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>

                <!-- Bottom Menu -->
                <div class="bottom-menu">

                    <div class="menu-item">
                        <i class="fa-solid fa-droplet"></i>
                        <span>Asset Products</span>
                    </div>

                    <div class="menu-item">
                        <i class="fa-solid fa-building-columns"></i>
                        <span>Deposit Products</span>
                    </div>

                    <div class="menu-item">
                        <i class="fa-solid fa-calculator"></i>
                        <span>EMI Calculator</span>
                    </div>

                    <div class="menu-item">
                        <i class="fa-solid fa-fire-flame-curved"></i>
                        <span>Rate Chart</span>
                    </div>

                    <div class="menu-item">
                        <i class="fa-solid fa-diamond"></i>
                        <span>About Us</span>
                    </div>

                    <div class="menu-item">
                        <i class="fa-solid fa-phone"></i>
                        <span>Contact Us</span>
                    </div>

                </div>

            </div>


            <!-- ================= RIGHT SIDE ================= -->
            <div class="right-section">

                <!-- Language -->
                <button id="languageBtn" class="language-btn">
                    <span id="languageText">বাংলা</span>
                </button>


                <!-- Company Logo -->
                <div class="company-logo">

                    <div class="logo-symbol small-logo">
                        <div class="logo-blue"></div>
                        <div class="logo-orange"></div>
                    </div>

                    <div>
                        <p class="bangla-name">
                            ন্যাশনাল ফাইন্যান্স
                        </p>

                        <p class="english-name">
                            National Finance
                        </p>
                    </div>

                </div>


                <!-- Login -->
                <div class="login-section">

                    <h2>Login</h2>

                    <form id="loginForm">

                        <!-- User ID -->
                        <div class="form-group">

                            <label for="userId">
                                User ID
                            </label>

                            <input
                                type="text"
                                id="userId"
                                placeholder="mehedi_569">

                        </div>


                        <!-- Password -->
                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <div class="password-wrapper">

                                <input
                                    type="password"
                                    id="password">

                                <button
                                    type="button"
                                    id="togglePassword">

                                    <i
                                        id="eyeIcon"
                                        class="fa-regular fa-eye-slash">
                                    </i>

                                </button>

                            </div>

                        </div>


                        <!-- Forgot Password -->
                        <div class="forgot-password">

                            <a href="#">
                                Forgot Password
                            </a>

                        </div>


                        <!-- Login -->
                        <button
                            type="submit"
                            class="login-btn">

                            LOGIN

                        </button>


                        <!-- Registration -->
                        <button
                            type="button"
                            id="registrationBtn"
                            class="registration-btn">

                            <span>
                                New Registration
                            </span>

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
